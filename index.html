<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Time Ledger</title>
<meta name="theme-color" content="#0a0b0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-mesh" aria-hidden="true"></div>

<div id="app" class="app">
  <div class="wrap">

    <header class="topbar">
      <div>
        <div class="eyebrow">Time Ledger</div>
      </div>
    </header>

    <!-- Punch clocks: one per company, run independently -->
    <section class="glass card">
      <div class="label">Punch clock</div>
      <div class="clocks-grid" id="clocks-grid"></div>
    </section>

    <!-- Manual entry -->
    <section id="manual-form" class="glass card hidden">
      <div class="card-head">
        <span class="label">Add entry manually</span>
        <button class="icon-btn" id="manual-cancel">✕</button>
      </div>
      <div class="row">
        <label class="field">
          <span>Company</span>
          <select id="manual-company" class="select-input select-full"></select>
        </label>
      </div>
      <div class="row">
        <label class="field">
          <span>Date</span>
          <input type="date" id="manual-date" />
        </label>
        <label class="field field-narrow">
          <span>Total hours</span>
          <input type="number" step="0.25" min="0" id="manual-hours" value="1" />
        </label>
      </div>
      <input type="text" id="manual-note" class="text-input" placeholder="Note (optional)" />
      <button id="manual-save" class="btn btn-primary btn-block" style="margin-top:10px">Save entry</button>
    </section>
    <button id="manual-toggle" class="link-btn manual-toggle-standalone">+ add time manually</button>

    <!-- Pay period summary (2 weeks) -->
    <section class="glass card">
      <div class="week-nav">
        <button class="icon-btn" id="period-prev">‹</button>
        <div>
          <div class="week-label" id="period-label">Pay period —</div>
          <button class="link-btn period-anchor-link" id="period-anchor-toggle">change period start</button>
        </div>
        <button class="icon-btn" id="period-next">›</button>
      </div>
      <div id="period-anchor-row" class="row hidden" style="margin-bottom:12px">
        <label class="field">
          <span>Any date in period 1 (e.g. your last payday's period start)</span>
          <input type="date" id="period-anchor-input" />
        </label>
        <button class="btn btn-primary btn-sm" id="period-anchor-save" style="align-self:flex-end">Save</button>
      </div>
      <div class="period-week">
        <div class="period-week-label" id="period-week1-label">Week 1</div>
        <div class="day-bars day-bars-compact" id="day-bars-week1"></div>
      </div>
      <div class="period-week">
        <div class="period-week-label" id="period-week2-label">Week 2</div>
        <div class="day-bars day-bars-compact" id="day-bars-week2"></div>
      </div>
      <div class="week-totals" id="period-totals"></div>
    </section>

    <!-- Weekly tasks -->
    <section class="glass card">
      <div class="week-nav">
        <button class="icon-btn" id="task-week-prev">‹</button>
        <div class="week-label" id="task-week-label">Tasks for week of —</div>
        <button class="icon-btn" id="task-week-next">›</button>
      </div>
      <div id="task-list" class="task-list"></div>
      <div class="row task-add-row">
        <input type="text" id="new-task-text" class="text-input" placeholder="New task…" />
        <select id="new-task-company" class="select-input"></select>
        <button id="add-task-btn" class="btn btn-primary btn-sm">+</button>
      </div>
    </section>

    <!-- Recent entries -->
    <section class="glass card">
      <div class="label">Recent entries</div>
      <div id="entries-list" class="entries-list"></div>
    </section>

    <div class="footnote">Syncs live across devices</div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
